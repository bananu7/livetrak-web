services:
  filebrowser:
    ports:
      - "8080:8080"
    image: "filebrowser/filebrowser"
    volumes:
      - ./config:/config
      - ./db:/database
      - ./data:/srv
  proxy:
    ports:
      - "8081:8081"
    image: "nginx:alpine"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
